services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: financial_stress_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./src:/app/src
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: financial_stress_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped